name: 💡 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议！请重点说明**使用场景**与**当前的不便**，而不只是"希望支持 X"。
        若建议与项目的设计目标冲突（如"内置离线 OCR 模型"会违背"浏览器端零模型下载"），请一并给出取舍建议。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到了什么问题？
      placeholder: 我在看 … 的视频时，希望 …
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前的不便
      description: 现在是怎么绕过的？为什么不够好？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？如果有 UI 设想或参考实现，欢迎描述
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 识别 / 翻译引擎
        - 截图方式
        - 字幕显示与外观
        - 控制面板 / 交互
        - 性能 / 资源占用
        - 文档
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认不是重复建议
          required: true
        - label: 我理解本项目的设计约束（单文件、无构建、无第三方运行时依赖、浏览器端不下载模型）
          required: true
