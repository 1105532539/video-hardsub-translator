<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!--
  模拟 YouTube / Gmail / Google 搜索等站点的安全策略。
  加了这条之后，直接给 innerHTML 赋字符串会抛 TypeError，
  脚本必须走 Trusted Types 策略才能把面板和字幕建出来。
-->
<meta http-equiv="Content-Security-Policy" content="require-trusted-types-for 'script'">
<title>字幕翻译 测试实验室（Trusted Types 严格模式）</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0d11; color: #dde3ee; font: 13px/1.6 sans-serif; }
  #wrap { padding: 14px; }
  video { display: block; }
</style>
</head>
<body>
<div id="wrap"></div>
<script src="pattern.js"></script>
<script src="lab.js"></script>
</body>
</html>
